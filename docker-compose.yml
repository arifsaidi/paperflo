services:
  # ─── PHP / Laravel App ───────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: paperflo_app
    restart: unless-stopped
    env_file: .env.docker
    volumes:
      - app_storage:/var/www/html/storage
      - app_cache:/var/www/html/bootstrap/cache
      - app_public:/var/www/html/public
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - paperflo

  # ─── Nginx ───────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: paperflo_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app_storage:/var/www/html/storage:ro
      - app_public:/var/www/html/public:ro
    depends_on:
      - app
    networks:
      - paperflo

  # ─── MySQL ───────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    container_name: paperflo_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: paperflo
      MYSQL_USER: paperflo
      MYSQL_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "33060:3306" # expose to host for local DB tools (3306 is in use locally)
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - paperflo

  # ─── Laravel Reverb (WebSockets) ─────────────────────────
  reverb:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: paperflo_reverb
    restart: unless-stopped
    env_file: .env.docker
    command: [ "php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080" ]
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - paperflo

volumes:
  mysql_data:
  app_storage:
  app_cache:
  app_public:

networks:
  paperflo:
    driver: bridge
